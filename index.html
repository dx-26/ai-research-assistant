<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Learning Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFEEE7;
    --paper-raised:#F8F7F2;
    --ink:#23291F;
    --ink-soft:#5B6156;
    --line:#D9D6C9;
    --line-strong:#C3BFAE;
    --teal:#1F6F63;
    --teal-bg:#DCEBE7;
    --indigo:#3A4A8F;
    --indigo-bg:#DEE1EF;
    --gold:#B9830F;
    --gold-bg:#F3E5C4;
    --plum:#7A4A6B;
    --plum-bg:#EBDCE6;
    --steel:#2E6E8E;
    --steel-bg:#DBE7ED;
    --clay:#A6543A;
    --clay-bg:#F0DED6;
    --amber:#C79A3D;
    --amber-bg:#F4E9CF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    padding:2.5rem 1.5rem 4rem;
  }
  .wrap{max-width:920px;margin:0 auto;}
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:26px;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  .subhead{color:var(--ink-soft);font-size:14px;margin:0 0 1.25rem;}
  .mono{font-family:'JetBrains Mono',monospace;}

  /* top nav */
  .top-nav{
    display:flex;
    gap:0;
    border:1px solid var(--ink);
    border-radius:6px;
    overflow:hidden;
    width:fit-content;
    margin-bottom:2rem;
  }
  .top-nav button{
    border:none;
    border-radius:0;
    background:var(--paper-raised);
    color:var(--ink-soft);
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:500;
    padding:9px 18px;
    cursor:pointer;
  }
  .top-nav button.active{background:var(--ink);color:var(--paper);}
  .top-nav button:not(.active):hover{background:var(--line);}

  .view{display:none;}
  .view.active{display:block;}

  /* rec card (tracker) */
  .rec-card{
    background:var(--paper-raised);
    border:1px solid var(--ink);
    border-radius:2px;
    position:relative;
    padding:1.5rem 1.75rem 1.75rem;
    margin-bottom:1.25rem;
    box-shadow: 3px 3px 0 var(--line-strong);
  }
  .rec-tab{
    position:absolute;top:-11px;left:24px;
    background:var(--ink);color:var(--paper-raised);
    font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.08em;
    padding:3px 10px;border-radius:2px;
  }
  .rec-label{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.06em;color:var(--ink-soft);text-transform:uppercase;margin:0.5rem 0 6px;}
  .rec-domain{font-family:'Fraunces',serif;font-size:24px;font-weight:500;margin:0 0 10px;}
  .rec-meta{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .pill{font-size:12px;padding:3px 10px;border-radius:12px;font-weight:500;}
  .rec-reason{font-size:14px;line-height:1.6;color:var(--ink);margin:0 0 14px;}
  .rec-empty{font-size:14px;color:var(--ink-soft);line-height:1.6;}
  .rec-actions{display:flex;gap:8px;flex-wrap:wrap;}

  .inprogress-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:2rem;}
  .inprogress-chip{
    flex-shrink:0;display:flex;align-items:center;gap:8px;
    background:var(--amber-bg);color:#6B4E12;border:1px solid var(--amber);
    border-radius:14px;padding:5px 12px;font-size:12px;white-space:nowrap;
  }
  .inprogress-chip .chip-title{font-weight:500;}
  .inprogress-chip button{background:none;border:none;padding:0;margin:0;font-size:14px;line-height:1;color:#6B4E12;cursor:pointer;}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;}
  @media(max-width:640px){.grid2{grid-template-columns:1fr;}}

  section{margin-bottom:2rem;}
  h2{
    font-family:'Fraunces',serif;font-size:17px;font-weight:500;margin:0 0 0.9rem;
    border-bottom:1px solid var(--line);padding-bottom:6px;
  }

  .domain-row{display:flex;align-items:flex-start;gap:10px;padding:8px 0;font-size:13px;}
  .domain-swatch{width:9px;height:9px;border-radius:2px;flex-shrink:0;margin-top:4px;}
  .domain-name{flex:1;color:var(--ink);display:flex;flex-direction:column;line-height:1.4;}
  .priority-star{color:var(--gold);font-size:11px;}
  .domain-sub{font-size:11px;color:var(--ink-soft);font-weight:400;}
  .domain-count{font-family:'JetBrains Mono',monospace;color:var(--ink-soft);font-size:12px;min-width:56px;text-align:right;margin-top:4px;}
  .bar-track{flex:1.2;height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:5px;}
  .bar-fill{height:100%;border-radius:3px;}

  form{background:var(--paper-raised);border:1px solid var(--line);border-radius:8px;padding:1.25rem;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
  label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:4px;}
  input,select{
    width:100%;padding:8px 10px;border:1px solid var(--line-strong);border-radius:6px;
    background:#fff;font-family:'Inter',sans-serif;font-size:13px;color:var(--ink);
  }
  input:focus,select:focus{outline:2px solid var(--teal);outline-offset:1px;}
  button{
    font-family:'Inter',sans-serif;font-size:13px;font-weight:500;cursor:pointer;
    border-radius:6px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:9px 16px;
  }
  button:hover{opacity:0.88;}
  button:disabled{opacity:0.5;cursor:default;}
  button.ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line-strong);font-weight:400;padding:5px 10px;font-size:12px;}
  button.small-primary{padding:6px 12px;font-size:12px;}
  .status-toggle{display:flex;gap:0;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden;}
  .status-toggle button{flex:1;border:none;border-radius:0;background:#fff;color:var(--ink-soft);font-weight:400;padding:8px 10px;}
  .status-toggle button.active{background:var(--ink);color:var(--paper);font-weight:500;}

  .item-row{
    display:grid;grid-template-columns:auto 1fr auto auto auto;align-items:center;gap:10px;
    padding:9px 4px;border-bottom:1px solid var(--line);font-size:13px;
  }
  .item-row:last-child{border-bottom:none;}
  .item-title{font-weight:500;}
  .item-meta{color:var(--ink-soft);font-size:12px;}
  .item-tags{margin-top:2px;}
  .tag-chip{display:inline-block;font-size:11px;color:var(--ink-soft);background:var(--line);border-radius:8px;padding:1px 7px;margin-right:4px;}
  .tag{font-size:11px;padding:2px 8px;border-radius:10px;white-space:nowrap;}
  .empty-state{text-align:center;padding:2rem 1rem;color:var(--ink-soft);font-size:14px;}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.9rem;gap:10px;flex-wrap:wrap;}
  #status{font-size:12px;color:var(--ink-soft);}
  .filter-row{display:flex;gap:8px;flex:1;min-width:220px;}
  .filter-row input, .filter-row select{width:auto;flex:1;}

  .search-panel{background:var(--paper-raised);border:1px solid var(--line);border-radius:8px;padding:1.25rem;}
  .search-controls{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:8px;align-items:end;}
  @media(max-width:700px){.search-controls{grid-template-columns:1fr 1fr;}}
  .search-note{font-size:12px;color:var(--ink-soft);margin:10px 0 0;}
  .search-loading{font-size:13px;color:var(--ink-soft);padding:1rem 0;}
  .search-error{font-size:13px;color:#8A3A2B;padding:0.75rem 0;}
  .result-card{border:1px solid var(--line);border-radius:8px;padding:0.9rem 1rem;margin-top:10px;background:#fff;}
  .result-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
  .result-title{font-family:'Fraunces',serif;font-size:15px;font-weight:500;margin:0 0 2px;}
  .result-platform{font-size:12px;color:var(--ink-soft);}
  .result-why{font-size:13px;color:var(--ink);margin:8px 0 10px;line-height:1.55;}
  .result-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .result-link{font-size:12px;color:var(--teal);text-decoration:none;border:1px solid var(--teal);border-radius:6px;padding:5px 10px;}
  .result-link:hover{background:var(--teal-bg);}

  /* research assistant */
  .ra-search-bar{display:flex;gap:8px;margin-bottom:1.5rem;}
  .ra-search-bar input{
    flex:1;padding:11px 14px;border:1px solid var(--line-strong);border-radius:6px;
    background:var(--paper-raised);font-family:'Inter',sans-serif;font-size:14px;color:var(--ink);
  }
  .ra-search-bar input:focus{outline:2px solid var(--teal);outline-offset:1px;}
  .dispatch{
    background:var(--paper-raised);border:1px solid var(--ink);border-radius:2px;position:relative;
    padding:1.5rem 1.75rem 1.5rem;margin-bottom:1.5rem;box-shadow: 3px 3px 0 var(--line-strong);
  }
  .dispatch-header{
    display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px dashed var(--line-strong);
    padding-bottom:8px;margin-bottom:12px;font-family:'JetBrains Mono',monospace;font-size:10px;
    letter-spacing:0.06em;color:var(--ink-soft);text-transform:uppercase;
  }
  .dispatch-query{font-family:'Fraunces',serif;font-size:19px;font-weight:500;margin:0 0 12px;line-height:1.35;}
  .dispatch-answer{font-size:14px;line-height:1.7;white-space:pre-wrap;margin:0 0 16px;}
  .sources-label{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.06em;color:var(--ink-soft);text-transform:uppercase;margin:0 0 8px;}
  .source-row{display:flex;gap:8px;align-items:baseline;font-size:13px;padding:4px 0;border-top:1px solid var(--line);}
  .source-num{font-family:'JetBrains Mono',monospace;color:var(--ink-soft);font-size:11px;min-width:16px;}
  .source-row a{color:var(--teal);text-decoration:none;}
  .source-row a:hover{text-decoration:underline;}
  .state-msg{font-size:13px;color:var(--ink-soft);padding:1rem 0;}
  .error-msg{font-size:13px;color:#8A3A2B;padding:1rem 0;}
  .log-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer;}
  .log-row:last-child{border-bottom:none;}
  .log-row:hover{background:var(--paper-raised);}
  .log-query{font-weight:500;}
  .log-time{font-family:'JetBrains Mono',monospace;color:var(--ink-soft);font-size:11px;white-space:nowrap;}
  .save-goal-row{border-top:1px dashed var(--line-strong);padding-top:12px;margin-top:4px;}
  .save-goal-grid{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:end;margin-top:8px;}
  @media(max-width:700px){.save-goal-grid{grid-template-columns:1fr 1fr;}}
  .confirm-msg{font-size:12px;color:var(--teal);margin-top:8px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Learning hub</h1>
  <p class="subhead">Track what you've finished, get one clear next step, and research anything as you go.</p>

  <div class="top-nav">
    <button type="button" id="nav-tracker" class="active">Tracker</button>
    <button type="button" id="nav-research">Research assistant</button>
  </div>

  <!-- ============ TRACKER VIEW ============ -->
  <div id="view-tracker" class="view active">

    <div id="recommendation"></div>
    <div id="inprogress-strip"></div>

    <div class="grid2">
      <section>
        <h2>Log a resource</h2>
        <form id="add-form">
          <div class="field-row">
            <div style="grid-column:1/-1;">
              <label for="title">Title</label>
              <input type="text" id="title" placeholder="e.g. Prompt Engineering for Developers" required>
            </div>
          </div>
          <div class="field-row">
            <div>
              <label for="domain">Domain</label>
              <select id="domain">
                <option value="AI">Artificial intelligence / GenAI</option>
                <option value="PM">Product management</option>
                <option value="BA">Business analytics</option>
                <option value="LEAD">Leadership and management</option>
                <option value="CLOUD">Cloud computing</option>
                <option value="STRAT">Strategy and business ops</option>
              </select>
            </div>
            <div>
              <label for="type">Format</label>
              <select id="type">
                <option value="course">Course</option>
                <option value="book">Book</option>
                <option value="article">Article</option>
                <option value="cert">Certification</option>
                <option value="paper">Research paper</option>
                <option value="podcast">Podcast</option>
                <option value="video">Video</option>
              </select>
            </div>
          </div>
          <div class="field-row">
            <div>
              <label for="level">Level</label>
              <select id="level">
                <option value="beginner">Beginner</option>
                <option value="intermediate">Intermediate</option>
                <option value="advanced">Advanced</option>
              </select>
            </div>
            <div>
              <label for="date">Date</label>
              <input type="date" id="date">
            </div>
          </div>
          <div class="field-row">
            <div style="grid-column:1/-1;">
              <label for="tags">Tags (optional, comma separated)</label>
              <input type="text" id="tags" placeholder="e.g. prompt engineering, roadmapping">
            </div>
          </div>
          <div class="field-row">
            <div style="grid-column:1/-1;">
              <label>Status</label>
              <div class="status-toggle">
                <button type="button" id="status-completed" class="active">Completed</button>
                <button type="button" id="status-inprogress">In progress</button>
              </div>
            </div>
          </div>
          <button type="submit" style="width:100%;margin-top:4px;">Add to log</button>
        </form>
      </section>

      <section>
        <h2>Coverage by domain</h2>
        <p style="font-size:12px;color:var(--ink-soft);margin:-4px 0 10px;">Counts completed items only.</p>
        <div id="domain-panel"></div>
      </section>
    </div>

    <section>
      <h2>Find resources online</h2>
      <div class="search-panel">
        <div class="search-controls">
          <div>
            <label for="resource-domain">Domain</label>
            <select id="resource-domain">
              <option value="AI">Artificial intelligence / GenAI</option>
              <option value="PM">Product management</option>
              <option value="BA">Business analytics</option>
              <option value="LEAD">Leadership and management</option>
              <option value="CLOUD">Cloud computing</option>
              <option value="STRAT">Strategy and business ops</option>
            </select>
          </div>
          <div>
            <label for="resource-level">Level</label>
            <select id="resource-level">
              <option value="beginner">Beginner</option>
              <option value="intermediate">Intermediate</option>
              <option value="advanced">Advanced</option>
            </select>
          </div>
          <div>
            <label for="resource-type">Format</label>
            <select id="resource-type">
              <option value="any">Any format</option>
              <option value="course">Course</option>
              <option value="book">Book</option>
              <option value="article">Article</option>
              <option value="cert">Certification</option>
              <option value="paper">Research paper</option>
              <option value="podcast">Podcast</option>
              <option value="video">Video</option>
            </select>
          </div>
          <button type="button" id="resource-search-btn">Search</button>
        </div>
        <p class="search-note">Uses live web search, and skips resources already in your completed log. <button type="button" id="resource-use-rec-btn" class="ghost" style="padding:2px 8px;">Use recommended focus</button></p>
        <div id="resource-results"></div>
      </div>
    </section>

    <section>
      <div class="toolbar">
        <h2 style="border:none;margin:0;">Completed log</h2>
        <div class="filter-row">
          <input type="text" id="search" placeholder="Search title or tag">
          <select id="filter-domain">
            <option value="">All domains</option>
            <option value="AI">AI / GenAI</option>
            <option value="PM">Product management</option>
            <option value="BA">Business analytics</option>
            <option value="LEAD">Leadership</option>
            <option value="CLOUD">Cloud computing</option>
            <option value="STRAT">Strategy</option>
          </select>
        </div>
        <span id="status" class="mono"></span>
      </div>
      <div id="log-list"></div>
    </section>
  </div>

  <!-- ============ RESEARCH VIEW ============ -->
  <div id="view-research" class="view">
    <div class="ra-search-bar">
      <input type="text" id="query-input" placeholder="Ask something…">
      <button type="button" id="search-btn">Search</button>
    </div>

    <div id="dispatch-area"></div>

    <section>
      <h2>Past searches</h2>
      <div id="ra-log-list"></div>
    </section>
  </div>

</div>

<script>
/* ================= shared ================= */
const DOMAINS = {
  AI:    { name:"Artificial intelligence / GenAI", color:"var(--teal)",   bg:"var(--teal-bg)" },
  PM:    { name:"Product management",              color:"var(--indigo)",bg:"var(--indigo-bg)" },
  BA:    { name:"Business analytics",              color:"var(--gold)",  bg:"var(--gold-bg)" },
  LEAD:  { name:"Leadership and management",       color:"var(--plum)",  bg:"var(--plum-bg)" },
  CLOUD: { name:"Cloud computing",                 color:"var(--steel)", bg:"var(--steel-bg)" },
  STRAT: { name:"Strategy and business ops",       color:"var(--clay)",  bg:"var(--clay-bg)" }
};
const DOMAIN_ORDER = ["AI","PM","STRAT","BA","LEAD","CLOUD"];
const PRIORITY_DOMAINS = ["AI","PM","STRAT"];
const LEVELS = ["beginner","intermediate","advanced"];
const TYPE_LABEL = { course:"Course", book:"Book", article:"Article", cert:"Certification", paper:"Research paper", podcast:"Podcast", video:"Video" };

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function formatTime(iso){
  const d = new Date(iso);
  return d.toLocaleDateString(undefined,{month:"short", day:"numeric"}) + " · " + d.toLocaleTimeString(undefined,{hour:"numeric", minute:"2-digit"});
}

/* ============ top nav ============ */
document.getElementById("nav-tracker").addEventListener("click", () => switchView("tracker"));
document.getElementById("nav-research").addEventListener("click", () => switchView("research"));
function switchView(name){
  document.getElementById("view-tracker").classList.toggle("active", name==="tracker");
  document.getElementById("view-research").classList.toggle("active", name==="research");
  document.getElementById("nav-tracker").classList.toggle("active", name==="tracker");
  document.getElementById("nav-research").classList.toggle("active", name==="research");
}

/* ================= tracker ================= */
let items = [];
let pendingStatus = "completed";
const TRACKER_STORAGE_KEY = "learning-items";

async function loadTracker(){
  document.getElementById("status").textContent = "Loading…";
  try{
    const res = await window.storage.get(TRACKER_STORAGE_KEY, false);
    items = res && res.value ? JSON.parse(res.value) : [];
    items.forEach(it => { if(!it.status) it.status = "completed"; if(!it.tags) it.tags = []; });
  }catch(e){
    items = [];
  }
  document.getElementById("status").textContent = "";
  renderTracker();
}
async function saveTracker(){
  try{
    await window.storage.set(TRACKER_STORAGE_KEY, JSON.stringify(items), false);
  }catch(e){
    document.getElementById("status").textContent = "Couldn't save — try again.";
  }
}
function daysSince(dateStr){
  const d = new Date(dateStr);
  return Math.floor((Date.now() - d.getTime()) / (1000*60*60*24));
}
function completedItems(){ return items.filter(i => i.status === "completed"); }
function domainStats(){
  const stats = {};
  DOMAIN_ORDER.forEach(k => stats[k] = { count:0, lastDate:null, maxLevel:-1, lastType:null, inProgress:0 });
  completedItems().forEach(it => {
    const s = stats[it.domain];
    if(!s) return;
    s.count++;
    if(!s.lastDate || it.date > s.lastDate){ s.lastDate = it.date; s.lastType = it.type; }
    const lvlIdx = LEVELS.indexOf(it.level);
    if(lvlIdx > s.maxLevel) s.maxLevel = lvlIdx;
  });
  items.filter(i => i.status === "inprogress").forEach(it => {
    const s = stats[it.domain];
    if(s) s.inProgress++;
  });
  return stats;
}
function recentTypes(n){
  return completedItems().slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,n).map(i=>i.type);
}
function computeRecommendation(){
  const done = completedItems();
  if(done.length === 0) return null;
  const stats = domainStats();
  let best = null, bestScore = -Infinity;
  DOMAIN_ORDER.forEach((key, idx) => {
    const s = stats[key];
    const gapDays = s.lastDate ? daysSince(s.lastDate) : 9999;
    const coverageScore = (1 / (s.count + 1)) * 100;
    const gapScore = Math.min(gapDays, 365) / 3;
    const priorityScore = (DOMAIN_ORDER.length - idx) * 2;
    const score = coverageScore + gapScore + priorityScore;
    if(score > bestScore){ bestScore = score; best = { key, s, gapDays }; }
  });
  const { key, s, gapDays } = best;
  const nextLevelIdx = Math.min(s.maxLevel + 1, LEVELS.length - 1);
  const nextLevel = s.count === 0 ? "beginner" : LEVELS[nextLevelIdx];
  const last2 = recentTypes(2);
  const typeOptions = ["course","book","article","paper","podcast","video","cert"];
  const suggestedType = typeOptions.find(t => !last2.includes(t)) || "course";
  let reason;
  if(s.count === 0){
    reason = `You haven't logged anything in this area yet, and it's one of your stated priorities. Starting here at a ${nextLevel} level closes the biggest gap in your current coverage.`;
  } else if(gapDays > 60){
    reason = `It's been about ${gapDays} days since your last item here (${s.count} completed so far). Picking this back up keeps momentum across all your priority areas instead of concentrating in just one or two.`;
  } else {
    reason = `You've built a base here (${s.count} completed, most recently at ${LEVELS[s.maxLevel]} level). Moving to ${nextLevel} is the natural next step rather than repeating the same level.`;
  }
  return { domain: key, level: nextLevel, type: suggestedType, reason };
}

function renderRecommendation(){
  const el = document.getElementById("recommendation");
  const rec = computeRecommendation();
  if(!rec){
    el.innerHTML = `
      <div class="rec-card">
        <div class="rec-tab">NEXT →</div>
        <p class="rec-empty">Log your first completed resource and this card will recommend where to focus next, based on your coverage across all six priority areas.</p>
      </div>`;
    return;
  }
  const d = DOMAINS[rec.domain];
  el.innerHTML = `
    <div class="rec-card">
      <div class="rec-tab">NEXT →</div>
      <p class="rec-label">Recommended focus</p>
      <p class="rec-domain">${d.name}</p>
      <div class="rec-meta">
        <span class="pill" style="background:${d.bg};color:${d.color};">Level: ${rec.level}</span>
        <span class="pill" style="background:var(--line);color:var(--ink-soft);">Format: ${TYPE_LABEL[rec.type]}</span>
      </div>
      <p class="rec-reason">${rec.reason}</p>
      <div class="rec-actions">
        <button type="button" id="rec-find-btn" class="small-primary">Find real resources for this</button>
        <button type="button" id="rec-research-btn" class="ghost">Ask the research assistant</button>
      </div>
    </div>`;

  document.getElementById("rec-find-btn").addEventListener("click", () => {
    document.getElementById("resource-domain").value = rec.domain;
    document.getElementById("resource-level").value = rec.level;
    document.getElementById("resource-type").value = rec.type;
    document.getElementById("resource-search-btn").scrollIntoView({behavior:"smooth", block:"center"});
    runResourceSearch();
  });

  document.getElementById("rec-research-btn").addEventListener("click", () => {
    const query = `What are the best current resources to learn ${d.name} at a ${rec.level} level?`;
    switchView("research");
    document.getElementById("query-input").value = query;
    runResearchSearch();
  });
}

function renderInProgress(){
  const el = document.getElementById("inprogress-strip");
  const inprog = items.filter(i => i.status === "inprogress");
  if(inprog.length === 0){ el.innerHTML = ""; return; }
  el.innerHTML = `<div class="inprogress-strip">` + inprog.map(it => {
    const d = DOMAINS[it.domain];
    return `<div class="inprogress-chip" style="border-color:${d.color};">
      <span class="chip-title">${escapeHtml(it.title)}</span>
      <span style="color:${d.color};">·</span>
      <button data-finish="${it.id}" title="Mark completed">✓</button>
      <button data-remove="${it.id}" title="Remove">×</button>
    </div>`;
  }).join("") + `</div>`;

  el.querySelectorAll("[data-finish]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const it = items.find(i => i.id === btn.dataset.finish);
      if(it){ it.status = "completed"; it.date = new Date().toISOString().slice(0,10); }
      await saveTracker();
      renderTracker();
    });
  });
  el.querySelectorAll("[data-remove]").forEach(btn => {
    btn.addEventListener("click", async () => {
      items = items.filter(i => i.id !== btn.dataset.remove);
      await saveTracker();
      renderTracker();
    });
  });
}

function renderDomainPanel(){
  const stats = domainStats();
  const active = PRIORITY_DOMAINS.filter(key => stats[key].count > 0 || stats[key].inProgress > 0);
  const toShow = active.length > 0 ? active : PRIORITY_DOMAINS;
  const maxCount = Math.max(1, ...toShow.map(k => stats[k].count));
  const rows = toShow.map(key => {
    const d = DOMAINS[key];
    const s = stats[key];
    const pct = Math.round((s.count / maxCount) * 100);
    const lastText = s.lastDate ? `last: ${daysSince(s.lastDate)}d ago` : "no completed items yet";
    const inProgText = s.inProgress > 0 ? ` · ${s.inProgress} in progress` : "";
    return `
      <div class="domain-row">
        <span class="domain-swatch" style="background:${d.color};"></span>
        <span class="domain-name">${d.name}
          <span class="domain-sub">${lastText}${inProgText}</span>
        </span>
        <span class="bar-track"><span class="bar-fill" style="width:${pct}%;background:${d.color};"></span></span>
        <span class="domain-count">${s.count} done</span>
      </div>`;
  }).join("");
  document.getElementById("domain-panel").innerHTML = rows;
}

function renderLog(){
  const listEl = document.getElementById("log-list");
  const rawSearch = document.getElementById("search").value.trim();
  const search = rawSearch.toLowerCase();
  const filterDomain = document.getElementById("filter-domain").value;
  let list = completedItems();
  if(filterDomain) list = list.filter(i => i.domain === filterDomain);
  if(search){
    list = list.filter(i =>
      i.title.toLowerCase().includes(search) ||
      (i.tags || []).some(t => t.toLowerCase().includes(search))
    );
  }
  if(list.length === 0){
    if(search){
      listEl.innerHTML = `
        <div class="empty-state">
          <p style="margin:0 0 10px;">No completed items match "${escapeHtml(rawSearch)}".</p>
          <button type="button" id="log-web-search-btn" class="small-primary">Search "${escapeHtml(rawSearch)}" on the web instead</button>
        </div>`;
      document.getElementById("log-web-search-btn").addEventListener("click", () => {
        switchView("research");
        document.getElementById("query-input").value = rawSearch;
        runResearchSearch();
      });
    }else{
      listEl.innerHTML = `<div class="empty-state">${items.length === 0 ? "Nothing logged yet. Add your first completed resource on the left." : "No completed items match this filter."}</div>`;
    }
    return;
  }
  const sorted = list.slice().sort((a,b)=>b.date.localeCompare(a.date));
  listEl.innerHTML = sorted.map(it => {
    const d = DOMAINS[it.domain];
    const tagsHtml = (it.tags && it.tags.length)
      ? `<div class="item-tags">${it.tags.map(t => `<span class="tag-chip">${escapeHtml(t)}</span>`).join("")}</div>`
      : "";
    return `
      <div class="item-row">
        <span class="domain-swatch" style="background:${d.color};"></span>
        <span>
          <div class="item-title">${escapeHtml(it.title)}</div>
          <div class="item-meta">${d.name} · ${it.level}</div>
          ${tagsHtml}
        </span>
        <span class="tag" style="background:${d.bg};color:${d.color};">${TYPE_LABEL[it.type]}</span>
        <span class="mono item-meta">${it.date}</span>
        <button class="ghost" data-id="${it.id}">Remove</button>
      </div>`;
  }).join("");
  listEl.querySelectorAll("button[data-id]").forEach(btn => {
    btn.addEventListener("click", async () => {
      items = items.filter(i => i.id !== btn.dataset.id);
      await saveTracker();
      renderTracker();
    });
  });
}

function renderTracker(){
  renderRecommendation();
  renderInProgress();
  renderDomainPanel();
  renderLog();
}

document.getElementById("status-completed").addEventListener("click", () => {
  pendingStatus = "completed";
  document.getElementById("status-completed").classList.add("active");
  document.getElementById("status-inprogress").classList.remove("active");
});
document.getElementById("status-inprogress").addEventListener("click", () => {
  pendingStatus = "inprogress";
  document.getElementById("status-inprogress").classList.add("active");
  document.getElementById("status-completed").classList.remove("active");
});

document.getElementById("add-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const title = document.getElementById("title").value.trim();
  if(!title) return;
  const domain = document.getElementById("domain").value;
  const type = document.getElementById("type").value;
  const level = document.getElementById("level").value;
  const dateInput = document.getElementById("date").value;
  const date = dateInput || new Date().toISOString().slice(0,10);
  const tagsRaw = document.getElementById("tags").value.trim();
  const tags = tagsRaw ? tagsRaw.split(",").map(t => t.trim()).filter(Boolean) : [];

  items.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    title, domain, type, level, date, tags,
    status: pendingStatus
  });
  await saveTracker();
  document.getElementById("add-form").reset();
  pendingStatus = "completed";
  document.getElementById("status-completed").classList.add("active");
  document.getElementById("status-inprogress").classList.remove("active");
  renderTracker();
});

document.getElementById("search").addEventListener("input", renderLog);
document.getElementById("filter-domain").addEventListener("change", renderLog);

async function fetchLiveResources(domainKey, level, type, excludeTitles){
  const domainName = DOMAINS[domainKey].name;
  const typeText = type === "any"
    ? "any format (course, book, article, certification, research paper, podcast, or video) — pick whichever best fits"
    : TYPE_LABEL[type];
  const excludeText = excludeTitles.length
    ? ` Do not recommend any of these, the person has already completed them: ${excludeTitles.join("; ")}.`
    : "";
  const prompt = `Search the web for 3 current, real, credible learning resources on "${domainName}", suited for someone at a ${level} skill level in that area. Prefer ${typeText}.${excludeText} Respond with ONLY a raw JSON array, no markdown code fences, no preamble, no text outside the JSON. Each item must be an object with exactly these keys: "title" (string), "platform" (string, publisher, author, or platform name), "url" (string, a real working url found via your search), "format" (one of: course, book, article, cert, paper, podcast, video), "why" (one plain-language sentence on why this fits someone at that level in that domain).`;

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1200,
      messages: [{ role: "user", content: prompt }],
      tools: [{ type: "web_search_20250305", name: "web_search" }]
    })
  });
  if(!response.ok) throw new Error("Request failed");
  const data = await response.json();
  const text = (data.content || []).filter(b => b.type === "text").map(b => b.text).join("\n");
  const clean = text.replace(/```json|```/g, "").trim();
  const parsed = JSON.parse(clean);
  if(!Array.isArray(parsed)) throw new Error("Unexpected response shape");
  return parsed;
}

async function runResourceSearch(){
  const domainKey = document.getElementById("resource-domain").value;
  const level = document.getElementById("resource-level").value;
  const type = document.getElementById("resource-type").value;
  const resultsEl = document.getElementById("resource-results");
  const btn = document.getElementById("resource-search-btn");
  const excludeTitles = items.filter(i => i.status === "completed" && i.domain === domainKey).map(i => i.title);

  btn.disabled = true;
  resultsEl.innerHTML = `<p class="search-loading">Searching the web for current ${DOMAINS[domainKey].name.toLowerCase()} resources…</p>`;

  try{
    const results = await fetchLiveResources(domainKey, level, type, excludeTitles);
    if(results.length === 0){
      resultsEl.innerHTML = `<p class="search-loading">No results came back. Try a different domain or level.</p>`;
    }else{
      resultsEl.innerHTML = results.map((r, idx) => {
        const format = TYPE_LABEL[r.format] ? r.format : "course";
        const safeUrl = /^https?:\/\//i.test(r.url || "") ? r.url : "#";
        return `
          <div class="result-card">
            <div class="result-top">
              <div>
                <p class="result-title">${escapeHtml(r.title || "Untitled")}</p>
                <p class="result-platform">${escapeHtml(r.platform || "")}${r.platform ? " · " : ""}${TYPE_LABEL[format] || "Course"}</p>
              </div>
            </div>
            <p class="result-why">${escapeHtml(r.why || "")}</p>
            <div class="result-actions">
              <a class="result-link" href="${safeUrl}" target="_blank" rel="noopener">Open resource</a>
              <button type="button" class="ghost" data-start-idx="${idx}">Start (mark in progress)</button>
            </div>
          </div>`;
      }).join("");
      resultsEl.querySelectorAll("[data-start-idx]").forEach(startBtn => {
        startBtn.addEventListener("click", async () => {
          const r = results[startBtn.dataset.startIdx];
          const format = TYPE_LABEL[r.format] ? r.format : "course";
          items.push({
            id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
            title: r.title || "Untitled",
            domain: domainKey, type: format, level: level,
            date: new Date().toISOString().slice(0,10), tags: [], status: "inprogress"
          });
          await saveTracker();
          renderTracker();
          startBtn.textContent = "Added ✓";
          startBtn.disabled = true;
        });
      });
    }
  }catch(err){
    resultsEl.innerHTML = `<p class="search-error">Couldn't fetch live results right now. Try again in a moment.</p>`;
  }finally{
    btn.disabled = false;
  }
}

document.getElementById("resource-search-btn").addEventListener("click", runResourceSearch);
document.getElementById("resource-use-rec-btn").addEventListener("click", () => {
  const rec = computeRecommendation();
  if(!rec) return;
  document.getElementById("resource-domain").value = rec.domain;
  document.getElementById("resource-level").value = rec.level;
  document.getElementById("resource-type").value = rec.type;
  runResourceSearch();
});

/* ================= research assistant ================= */
const RESEARCH_STORAGE_KEY = "research-log";
let researchLog = [];

async function loadResearchLog(){
  try{
    const res = await window.storage.get(RESEARCH_STORAGE_KEY, false);
    researchLog = res && res.value ? JSON.parse(res.value) : [];
  }catch(e){
    researchLog = [];
  }
  renderResearchLog();
}
async function saveResearchLog(){
  try{
    await window.storage.set(RESEARCH_STORAGE_KEY, JSON.stringify(researchLog), false);
  }catch(e){ /* best-effort */ }
}

function renderDispatch(entry){
  const el = document.getElementById("dispatch-area");
  const sourcesHtml = (entry.sources && entry.sources.length)
    ? entry.sources.map((s, i) => {
        const safeUrl = /^https?:\/\//i.test(s.url || "") ? s.url : "#";
        return `<div class="source-row"><span class="source-num">${i+1}</span><a href="${safeUrl}" target="_blank" rel="noopener">${escapeHtml(s.title || s.url || "Source")}</a></div>`;
      }).join("")
    : `<p class="state-msg" style="padding:0;">No sources returned.</p>`;

  const domainOptions = DOMAIN_ORDER.map(k => `<option value="${k}">${DOMAINS[k].name}</option>`).join("");

  el.innerHTML = `
    <div class="dispatch">
      <div class="dispatch-header">
        <span>Filed ${formatTime(entry.timestamp)}</span>
        <span>Live web search</span>
      </div>
      <p class="dispatch-query">${escapeHtml(entry.query)}</p>
      <p class="dispatch-answer">${escapeHtml(entry.answer)}</p>
      <p class="sources-label">Sources</p>
      ${sourcesHtml}
      <div class="save-goal-row">
        <p class="sources-label" style="margin-bottom:0;">Turn this into a tracker goal</p>
        <div class="save-goal-grid">
          <select id="goal-domain">${domainOptions}</select>
          <select id="goal-level">
            <option value="beginner">Beginner</option>
            <option value="intermediate">Intermediate</option>
            <option value="advanced">Advanced</option>
          </select>
          <select id="goal-type">
            <option value="course">Course</option>
            <option value="book">Book</option>
            <option value="article">Article</option>
            <option value="cert">Certification</option>
            <option value="paper">Research paper</option>
            <option value="podcast">Podcast</option>
            <option value="video">Video</option>
          </select>
          <button type="button" id="goal-save-btn" class="small-primary">Add to tracker</button>
        </div>
        <div id="goal-confirm"></div>
      </div>
    </div>`;

  document.getElementById("goal-save-btn").addEventListener("click", async () => {
    const domain = document.getElementById("goal-domain").value;
    const level = document.getElementById("goal-level").value;
    const type = document.getElementById("goal-type").value;
    items.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
      title: entry.query, domain, type, level,
      date: new Date().toISOString().slice(0,10), tags: [], status: "inprogress"
    });
    await saveTracker();
    renderTracker();
    document.getElementById("goal-confirm").innerHTML = `<p class="confirm-msg">Added to tracker as in-progress — view it in the Tracker tab.</p>`;
  });
}

function renderResearchLog(){
  const el = document.getElementById("ra-log-list");
  if(researchLog.length === 0){
    el.innerHTML = `<div class="empty-state">Your searches will show up here so you can revisit past answers without re-running them.</div>`;
    return;
  }
  const sorted = researchLog.slice().sort((a,b) => b.timestamp.localeCompare(a.timestamp));
  el.innerHTML = sorted.map(entry => `
    <div class="log-row" data-id="${entry.id}">
      <span class="log-query">${escapeHtml(entry.query)}</span>
      <span class="log-time">${formatTime(entry.timestamp)}</span>
    </div>`).join("");
  el.querySelectorAll(".log-row").forEach(row => {
    row.addEventListener("click", () => {
      const entry = researchLog.find(e => e.id === row.dataset.id);
      if(entry){
        renderDispatch(entry);
        document.getElementById("dispatch-area").scrollIntoView({behavior:"smooth", block:"start"});
      }
    });
  });
}

async function runResearchSearch(){
  const input = document.getElementById("query-input");
  const query = input.value.trim();
  if(!query) return;
  const btn = document.getElementById("search-btn");
  const dispatchArea = document.getElementById("dispatch-area");

  btn.disabled = true;
  dispatchArea.innerHTML = `<p class="state-msg">Searching the web and synthesizing an answer…</p>`;

  const prompt = `Search the web to answer this question thoroughly and accurately: "${query}". Then respond with ONLY a raw JSON object, no markdown code fences, no preamble, no text outside the JSON. It must have exactly these keys: "answer" (a clear, well-organized answer in your own words, roughly 120-300 words, plain text — never copy sentences directly from a source), "sources" (an array of 3-6 objects, each with "title" and "url", listing the real sources you used).`;

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1500,
        messages: [{ role: "user", content: prompt }],
        tools: [{ type: "web_search_20250305", name: "web_search" }]
      })
    });
    if(!response.ok) throw new Error("Request failed");
    const data = await response.json();
    const text = (data.content || []).filter(b => b.type === "text").map(b => b.text).join("\n");
    const clean = text.replace(/```json|```/g, "").trim();
    const parsed = JSON.parse(clean);

    const entry = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
      query,
      answer: parsed.answer || "No answer returned.",
      sources: Array.isArray(parsed.sources) ? parsed.sources : [],
      timestamp: new Date().toISOString()
    };
    researchLog.push(entry);
    await saveResearchLog();
    renderDispatch(entry);
    renderResearchLog();
    input.value = "";
  }catch(err){
    dispatchArea.innerHTML = `<p class="error-msg">Couldn't complete that search right now. Try again in a moment.</p>`;
  }finally{
    btn.disabled = false;
  }
}

document.getElementById("search-btn").addEventListener("click", runResearchSearch);
document.getElementById("query-input").addEventListener("keydown", (e) => {
  if(e.key === "Enter") runResearchSearch();
});

/* ================= init ================= */
loadTracker();
loadResearchLog();
</script>
