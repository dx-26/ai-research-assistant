<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Learning Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFEEE7;
    --paper-raised:#F8F7F2;
    --ink:#23291F;
    --ink-soft:#5B6156;
    --line:#D9D6C9;
    --line-strong:#C3BFAE;
    --teal:#1F6F63;
    --teal-bg:#DCEBE7;
    --indigo:#3A4A8F;
    --indigo-bg:#DEE1EF;
    --gold:#B9830F;
    --gold-bg:#F3E5C4;
    --plum:#7A4A6B;
    --plum-bg:#EBDCE6;
    --steel:#2E6E8E;
    --steel-bg:#DBE7ED;
    --clay:#A6543A;
    --clay-bg:#F0DED6;
    --amber:#C79A3D;
    --amber-bg:#F4E9CF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    padding:2.5rem 1.5rem 4rem;
  }
  .wrap{max-width:920px;margin:0 auto;}
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:28px;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  .subhead{color:var(--ink-soft);font-size:14px;margin:0 0 2rem;}
  .mono{font-family:'JetBrains Mono',monospace;}

  .rec-card{
    background:var(--paper-raised);
    border:1px solid var(--ink);
    border-radius:2px;
    position:relative;
    padding:1.5rem 1.75rem 1.75rem;
    margin-bottom:1.25rem;
    box-shadow: 3px 3px 0 var(--line-strong);
  }
  .rec-tab{
    position:absolute;
    top:-11px;
    left:24px;
    background:var(--ink);
    color:var(--paper-raised);
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    letter-spacing:0.08em;
    padding:3px 10px;
    border-radius:2px;
  }
  .rec-label{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:0.06em;
    color:var(--ink-soft);
    text-transform:uppercase;
    margin:0.5rem 0 6px;
  }
  .rec-domain{
    font-family:'Fraunces',serif;
    font-size:24px;
    font-weight:500;
    margin:0 0 10px;
  }
  .rec-meta{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .pill{
    font-size:12px;
    padding:3px 10px;
    border-radius:12px;
    font-weight:500;
  }
  .rec-reason{font-size:14px;line-height:1.6;color:var(--ink);}
  .rec-empty{font-size:14px;color:var(--ink-soft);line-height:1.6;}

  .inprogress-strip{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:6px;
    margin-bottom:2rem;
  }
  .inprogress-chip{
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--amber-bg);
    color:#6B4E12;
    border:1px solid var(--amber);
    border-radius:14px;
    padding:5px 12px;
    font-size:12px;
    white-space:nowrap;
  }
  .inprogress-chip .chip-title{font-weight:500;}
  .inprogress-chip button{
    background:none;border:none;padding:0;margin:0;
    font-size:14px;line-height:1;color:#6B4E12;cursor:pointer;
  }

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;}
  @media(max-width:640px){.grid2{grid-template-columns:1fr;}}

  section{margin-bottom:2rem;}
  h2{
    font-family:'Fraunces',serif;
    font-size:17px;
    font-weight:500;
    margin:0 0 0.9rem;
    border-bottom:1px solid var(--line);
    padding-bottom:6px;
  }

  .domain-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:7px 0;
    font-size:13px;
  }
  .domain-swatch{width:9px;height:9px;border-radius:2px;flex-shrink:0;}
  .domain-name{flex:1;color:var(--ink);}
  .domain-count{font-family:'JetBrains Mono',monospace;color:var(--ink-soft);font-size:12px;min-width:56px;text-align:right;}
  .bar-track{flex:1.2;height:5px;background:var(--line);border-radius:3px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:3px;}

  form{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:8px;
    padding:1.25rem;
  }
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
  label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:4px;}
  input,select{
    width:100%;
    padding:8px 10px;
    border:1px solid var(--line-strong);
    border-radius:6px;
    background:#fff;
    font-family:'Inter',sans-serif;
    font-size:13px;
    color:var(--ink);
  }
  input:focus,select:focus{outline:2px solid var(--teal);outline-offset:1px;}
  button{
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:500;
    cursor:pointer;
    border-radius:6px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    padding:9px 16px;
  }
  button:hover{opacity:0.88;}
  button.ghost{
    background:transparent;
    color:var(--ink-soft);
    border:1px solid var(--line-strong);
    font-weight:400;
    padding:5px 10px;
    font-size:12px;
  }
  .status-toggle{display:flex;gap:0;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden;}
  .status-toggle button{
    flex:1;border:none;border-radius:0;background:#fff;color:var(--ink-soft);
    font-weight:400;padding:8px 10px;
  }
  .status-toggle button.active{background:var(--ink);color:var(--paper);font-weight:500;}

  .item-row{
    display:grid;
    grid-template-columns:auto 1fr auto auto auto;
    align-items:center;
    gap:10px;
    padding:9px 4px;
    border-bottom:1px solid var(--line);
    font-size:13px;
  }
  .item-row:last-child{border-bottom:none;}
  .item-title{font-weight:500;}
  .item-meta{color:var(--ink-soft);font-size:12px;}
  .item-tags{margin-top:2px;}
  .tag-chip{
    display:inline-block;
    font-size:11px;
    color:var(--ink-soft);
    background:var(--line);
    border-radius:8px;
    padding:1px 7px;
    margin-right:4px;
  }
  .tag{
    font-size:11px;
    padding:2px 8px;
    border-radius:10px;
    white-space:nowrap;
  }
  .empty-state{
    text-align:center;
    padding:2rem 1rem;
    color:var(--ink-soft);
    font-size:14px;
  }
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.9rem;gap:10px;flex-wrap:wrap;}
  #status{font-size:12px;color:var(--ink-soft);}
  .filter-row{display:flex;gap:8px;flex:1;min-width:220px;}
  .filter-row input, .filter-row select{width:auto;flex:1;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Learning tracker</h1>
  <p class="subhead">Log what you've finished. Get one clear next step.</p>

  <div id="recommendation"></div>
  <div id="inprogress-strip"></div>

  <div class="grid2">
    <section>
      <h2>Log a resource</h2>
      <form id="add-form">
        <div class="field-row">
          <div style="grid-column:1/-1;">
            <label for="title">Title</label>
            <input type="text" id="title" placeholder="e.g. Prompt Engineering for Developers" required>
          </div>
        </div>
        <div class="field-row">
          <div>
            <label for="domain">Domain</label>
            <select id="domain">
              <option value="AI">Artificial intelligence / GenAI</option>
              <option value="PM">Product management</option>
              <option value="BA">Business analytics</option>
              <option value="LEAD">Leadership and management</option>
              <option value="CLOUD">Cloud computing</option>
              <option value="STRAT">Strategy and business ops</option>
            </select>
          </div>
          <div>
            <label for="type">Format</label>
            <select id="type">
              <option value="course">Course</option>
              <option value="book">Book</option>
              <option value="article">Article</option>
              <option value="cert">Certification</option>
              <option value="paper">Research paper</option>
              <option value="podcast">Podcast</option>
              <option value="video">Video</option>
            </select>
          </div>
        </div>
        <div class="field-row">
          <div>
            <label for="level">Level</label>
            <select id="level">
              <option value="beginner">Beginner</option>
              <option value="intermediate">Intermediate</option>
              <option value="advanced">Advanced</option>
            </select>
          </div>
          <div>
            <label for="date">Date</label>
            <input type="date" id="date">
          </div>
        </div>
        <div class="field-row">
          <div style="grid-column:1/-1;">
            <label for="tags">Tags (optional, comma separated)</label>
            <input type="text" id="tags" placeholder="e.g. prompt engineering, roadmapping">
          </div>
        </div>
        <div class="field-row">
          <div style="grid-column:1/-1;">
            <label>Status</label>
            <div class="status-toggle">
              <button type="button" id="status-completed" class="active">Completed</button>
              <button type="button" id="status-inprogress">In progress</button>
            </div>
          </div>
        </div>
        <button type="submit" style="width:100%;margin-top:4px;">Add to log</button>
      </form>
    </section>

    <section>
      <h2>Coverage by domain</h2>
      <p style="font-size:12px;color:var(--ink-soft);margin:-4px 0 10px;">Counts completed items only.</p>
      <div id="domain-panel"></div>
    </section>
  </div>

  <section>
    <div class="toolbar">
      <h2 style="border:none;margin:0;">Completed log</h2>
      <div class="filter-row">
        <input type="text" id="search" placeholder="Search title or tag">
        <select id="filter-domain">
          <option value="">All domains</option>
          <option value="AI">AI / GenAI</option>
          <option value="PM">Product management</option>
          <option value="BA">Business analytics</option>
          <option value="LEAD">Leadership</option>
          <option value="CLOUD">Cloud computing</option>
          <option value="STRAT">Strategy</option>
        </select>
      </div>
      <span id="status" class="mono"></span>
    </div>
    <div id="log-list"></div>
  </section>
</div>

<script>
const DOMAINS = {
  AI:    { name:"Artificial intelligence / GenAI", color:"var(--teal)",   bg:"var(--teal-bg)" },
  PM:    { name:"Product management",              color:"var(--indigo)",bg:"var(--indigo-bg)" },
  BA:    { name:"Business analytics",              color:"var(--gold)",  bg:"var(--gold-bg)" },
  LEAD:  { name:"Leadership and management",       color:"var(--plum)",  bg:"var(--plum-bg)" },
  CLOUD: { name:"Cloud computing",                 color:"var(--steel)", bg:"var(--steel-bg)" },
  STRAT: { name:"Strategy and business ops",       color:"var(--clay)",  bg:"var(--clay-bg)" }
};
const DOMAIN_ORDER = ["AI","PM","BA","LEAD","CLOUD","STRAT"];
const LEVELS = ["beginner","intermediate","advanced"];
const TYPE_LABEL = { course:"Course", book:"Book", article:"Article", cert:"Certification", paper:"Research paper", podcast:"Podcast", video:"Video" };

let items = [];
let pendingStatus = "completed";
const STORAGE_KEY = "learning-items";

async function load(){
  document.getElementById("status").textContent = "Loading…";
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    items = res && res.value ? JSON.parse(res.value) : [];
    items.forEach(it => { if(!it.status) it.status = "completed"; if(!it.tags) it.tags = []; });
  }catch(e){
    items = [];
  }
  document.getElementById("status").textContent = "";
  render();
}

async function save(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(items), false);
  }catch(e){
    document.getElementById("status").textContent = "Couldn't save — try again.";
  }
}

function daysSince(dateStr){
  const d = new Date(dateStr);
  return Math.floor((Date.now() - d.getTime()) / (1000*60*60*24));
}

function completedItems(){
  return items.filter(i => i.status === "completed");
}

function domainStats(){
  const stats = {};
  DOMAIN_ORDER.forEach(k => stats[k] = { count:0, lastDate:null, maxLevel:-1, lastType:null });
  completedItems().forEach(it => {
    const s = stats[it.domain];
    if(!s) return;
    s.count++;
    if(!s.lastDate || it.date > s.lastDate){ s.lastDate = it.date; s.lastType = it.type; }
    const lvlIdx = LEVELS.indexOf(it.level);
    if(lvlIdx > s.maxLevel) s.maxLevel = lvlIdx;
  });
  return stats;
}

function recentTypes(n){
  return completedItems().slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,n).map(i=>i.type);
}

function computeRecommendation(){
  const done = completedItems();
  if(done.length === 0) return null;
  const stats = domainStats();
  let best = null;
  let bestScore = -Infinity;

  DOMAIN_ORDER.forEach((key, idx) => {
    const s = stats[key];
    const gapDays = s.lastDate ? daysSince(s.lastDate) : 9999;
    const coverageScore = (1 / (s.count + 1)) * 100;
    const gapScore = Math.min(gapDays, 365) / 3;
    const priorityScore = (DOMAIN_ORDER.length - idx) * 2;
    const score = coverageScore + gapScore + priorityScore;
    if(score > bestScore){ bestScore = score; best = { key, s, gapDays }; }
  });

  const { key, s, gapDays } = best;
  const nextLevelIdx = Math.min(s.maxLevel + 1, LEVELS.length - 1);
  const nextLevel = s.count === 0 ? "beginner" : LEVELS[nextLevelIdx];

  const last2 = recentTypes(2);
  const typeOptions = ["course","book","article","paper","podcast","video","cert"];
  const suggestedType = typeOptions.find(t => !last2.includes(t)) || "course";

  let reason;
  if(s.count === 0){
    reason = `You haven't logged anything in this area yet, and it's one of your stated priorities. Starting here at a ${nextLevel} level closes the biggest gap in your current coverage.`;
  } else if(gapDays > 60){
    reason = `It's been about ${gapDays} days since your last item here (${s.count} completed so far). Picking this back up keeps momentum across all your priority areas instead of concentrating in just one or two.`;
  } else {
    reason = `You've built a base here (${s.count} completed, most recently at ${LEVELS[s.maxLevel]} level). Moving to ${nextLevel} is the natural next step rather than repeating the same level.`;
  }

  return { domain: key, level: nextLevel, type: suggestedType, reason };
}

function renderRecommendation(){
  const el = document.getElementById("recommendation");
  const rec = computeRecommendation();
  if(!rec){
    el.innerHTML = `
      <div class="rec-card">
        <div class="rec-tab">NEXT →</div>
        <p class="rec-empty">Log your first completed resource and this card will recommend where to focus next, based on your coverage across all six priority areas.</p>
      </div>`;
    return;
  }
  const d = DOMAINS[rec.domain];
  el.innerHTML = `
    <div class="rec-card">
      <div class="rec-tab">NEXT →</div>
      <p class="rec-label">Recommended focus</p>
      <p class="rec-domain">${d.name}</p>
      <div class="rec-meta">
        <span class="pill" style="background:${d.bg};color:${d.color};">Level: ${rec.level}</span>
        <span class="pill" style="background:var(--line);color:var(--ink-soft);">Format: ${TYPE_LABEL[rec.type]}</span>
      </div>
      <p class="rec-reason">${rec.reason}</p>
    </div>`;
}

function renderInProgress(){
  const el = document.getElementById("inprogress-strip");
  const inprog = items.filter(i => i.status === "inprogress");
  if(inprog.length === 0){ el.innerHTML = ""; return; }
  el.innerHTML = `<div class="inprogress-strip">` + inprog.map(it => {
    const d = DOMAINS[it.domain];
    return `<div class="inprogress-chip" style="border-color:${d.color};">
      <span class="chip-title">${escapeHtml(it.title)}</span>
      <span style="color:${d.color};">·</span>
      <button data-finish="${it.id}" title="Mark completed">✓</button>
      <button data-remove="${it.id}" title="Remove">×</button>
    </div>`;
  }).join("") + `</div>`;

  el.querySelectorAll("[data-finish]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const it = items.find(i => i.id === btn.dataset.finish);
      if(it){ it.status = "completed"; it.date = new Date().toISOString().slice(0,10); }
      await save();
      render();
    });
  });
  el.querySelectorAll("[data-remove]").forEach(btn => {
    btn.addEventListener("click", async () => {
      items = items.filter(i => i.id !== btn.dataset.remove);
      await save();
      render();
    });
  });
}

function renderDomainPanel(){
  const stats = domainStats();
  const maxCount = Math.max(1, ...DOMAIN_ORDER.map(k => stats[k].count));
  const rows = DOMAIN_ORDER.map(key => {
    const d = DOMAINS[key];
    const s = stats[key];
    const pct = Math.round((s.count / maxCount) * 100);
    return `
      <div class="domain-row">
        <span class="domain-swatch" style="background:${d.color};"></span>
        <span class="domain-name">${d.name}</span>
        <span class="bar-track"><span class="bar-fill" style="width:${pct}%;background:${d.color};"></span></span>
        <span class="domain-count">${s.count} done</span>
      </div>`;
  }).join("");
  document.getElementById("domain-panel").innerHTML = rows;
}

function renderLog(){
  const listEl = document.getElementById("log-list");
  const search = document.getElementById("search").value.trim().toLowerCase();
  const filterDomain = document.getElementById("filter-domain").value;

  let list = completedItems();
  if(filterDomain) list = list.filter(i => i.domain === filterDomain);
  if(search){
    list = list.filter(i =>
      i.title.toLowerCase().includes(search) ||
      (i.tags || []).some(t => t.toLowerCase().includes(search))
    );
  }

  if(list.length === 0){
    listEl.innerHTML = `<div class="empty-state">${items.length === 0 ? "Nothing logged yet. Add your first completed resource on the left." : "No completed items match this search or filter."}</div>`;
    return;
  }
  const sorted = list.slice().sort((a,b)=>b.date.localeCompare(a.date));
  listEl.innerHTML = sorted.map(it => {
    const d = DOMAINS[it.domain];
    const tagsHtml = (it.tags && it.tags.length)
      ? `<div class="item-tags">${it.tags.map(t => `<span class="tag-chip">${escapeHtml(t)}</span>`).join("")}</div>`
      : "";
    return `
      <div class="item-row">
        <span class="domain-swatch" style="background:${d.color};"></span>
        <span>
          <div class="item-title">${escapeHtml(it.title)}</div>
          <div class="item-meta">${d.name} · ${it.level}</div>
          ${tagsHtml}
        </span>
        <span class="tag" style="background:${d.bg};color:${d.color};">${TYPE_LABEL[it.type]}</span>
        <span class="mono item-meta">${it.date}</span>
        <button class="ghost" data-id="${it.id}">Remove</button>
      </div>`;
  }).join("");

  listEl.querySelectorAll("button[data-id]").forEach(btn => {
    btn.addEventListener("click", async () => {
      items = items.filter(i => i.id !== btn.dataset.id);
      await save();
      render();
    });
  });
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function render(){
  renderRecommendation();
  renderInProgress();
  renderDomainPanel();
  renderLog();
}

document.getElementById("status-completed").addEventListener("click", () => {
  pendingStatus = "completed";
  document.getElementById("status-completed").classList.add("active");
  document.getElementById("status-inprogress").classList.remove("active");
});
document.getElementById("status-inprogress").addEventListener("click", () => {
  pendingStatus = "inprogress";
  document.getElementById("status-inprogress").classList.add("active");
  document.getElementById("status-completed").classList.remove("active");
});

document.getElementById("add-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const title = document.getElementById("title").value.trim();
  if(!title) return;
  const domain = document.getElementById("domain").value;
  const type = document.getElementById("type").value;
  const level = document.getElementById("level").value;
  const dateInput = document.getElementById("date").value;
  const date = dateInput || new Date().toISOString().slice(0,10);
  const tagsRaw = document.getElementById("tags").value.trim();
  const tags = tagsRaw ? tagsRaw.split(",").map(t => t.trim()).filter(Boolean) : [];

  items.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    title, domain, type, level, date, tags,
    status: pendingStatus
  });
  await save();
  document.getElementById("add-form").reset();
  pendingStatus = "completed";
  document.getElementById("status-completed").classList.add("active");
  document.getElementById("status-inprogress").classList.remove("active");
  render();
});

document.getElementById("search").addEventListener("input", renderLog);
document.getElementById("filter-domain").addEventListener("change", renderLog);

load();
</script>
</body>
</html>
